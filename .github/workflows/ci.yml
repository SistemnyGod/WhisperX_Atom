name: CI

on:
  push:
    branches: [main, codex/server-first-platform]
  pull_request:
    branches: [main, codex/server-first-platform]
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build the optional Windows installer
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dotnet-build:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: artifacts/nuget-packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore apps/server/WhisperX.Atom.Api/WhisperX.Atom.Api.csproj
      - run: dotnet restore apps/recorder-agent/WhisperX.Atom.Recorder.Core.csproj
      - run: dotnet restore apps/recorder-host/WhisperX.Atom.Recorder.Host.csproj
      - run: dotnet restore apps/recorder-agent/WhisperX.Atom.Recorder.Service.csproj
      - run: dotnet restore apps/voice-host/WhisperX.Atom.Voice.Host/WhisperX.Atom.Voice.Host.csproj
      - run: dotnet restore apps/desktop/WhisperX.Atom.Desktop/WhisperX.Atom.Desktop.csproj
      - name: Restore .NET test projects
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path . -Recurse -Filter '*Tests.csproj' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\\/]obj[\\/]|[\\/]bin[\\/]' })
          foreach ($project in $projects) {
            dotnet restore $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: dotnet build apps/server/WhisperX.Atom.Api/WhisperX.Atom.Api.csproj --no-restore -c Release
      - run: dotnet build apps/recorder-agent/WhisperX.Atom.Recorder.Core.csproj --no-restore -c Release
      - run: dotnet build apps/recorder-host/WhisperX.Atom.Recorder.Host.csproj --no-restore -c Release
      - run: dotnet build apps/recorder-agent/WhisperX.Atom.Recorder.Service.csproj --no-restore -c Release
      - run: dotnet build apps/voice-host/WhisperX.Atom.Voice.Host/WhisperX.Atom.Voice.Host.csproj --no-restore -c Release
      - run: dotnet publish apps/desktop/WhisperX.Atom.Desktop/WhisperX.Atom.Desktop.csproj --no-restore -c Release -r win-x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o artifacts/ci/desktop
      - name: Run .NET tests when test projects are present
        shell: pwsh
        run: |
          ./scripts/run-dotnet-tests.ps1 -Configuration Release -NoRestore -TimeoutSeconds 60
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-validation
          path: artifacts/ci/desktop
          retention-days: 7

  python-targeted-tests:
    runs-on: ubuntu-latest
    env:
      WHISPERX_RUN_FILESYSTEM_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.test.lock.txt
      - name: Run unit and contract tests
        run: python -m pytest -q -m "unit or contract" tests

  python-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine3.21
        ports:
          - 5432/tcp
        env:
          POSTGRES_DB: whisperx_ci
          POSTGRES_USER: whisperx
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U whisperx -d whisperx_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://whisperx:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/whisperx_ci
      # Memory projection tests intentionally refuse DATABASE_URL so they can
      # never accidentally use a developer/LAN database.  CI supplies their
      # explicitly isolated connection string as well.
      WHISPERX_TEST_DATABASE: postgresql://whisperx:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/whisperx_ci
      WHISPERX_REQUIRE_MEMORY_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.test.lock.txt
      - name: Apply production migrations to the isolated integration database
        run: python scripts/apply-test-migrations.py
      - name: Run PostgreSQL integration tests
        run: |
          python -m pytest -q tests/test_gpu_runtime_integration.py
          python -m pytest -q tests/test_memory_postgres_integration.py

  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine3.21
        ports:
          - 5432/tcp
        env:
          POSTGRES_DB: whisperx_ci
          POSTGRES_USER: whisperx
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U whisperx -d whisperx_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations in filename order
        env:
          PGPASSWORD: ci-only-password
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGUSER: whisperx
          PGDATABASE: whisperx_ci
        run: |
          for migration in $(find apps/server/WhisperX.Atom.Api/Migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | sort); do
            psql -v ON_ERROR_STOP=1 -f "apps/server/WhisperX.Atom.Api/Migrations/$migration"
          done
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) AS migration_tables FROM information_schema.tables WHERE table_schema='public';"

  desktop-resource-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/test-desktop-resources.ps1

  optional-package-installer:
    if: github.event_name == 'workflow_dispatch' && inputs.build_installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore apps/desktop/WhisperX.Atom.Desktop/WhisperX.Atom.Desktop.csproj
      - run: ./scripts/publish-desktop.ps1 -NoRestore
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer
          path: artifacts/publish
          retention-days: 14
