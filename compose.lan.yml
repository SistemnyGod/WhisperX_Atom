services:
  postgres:
    ports: !reset []

  nats:
    ports: !reset []

  tusd:
    ports: !reset []

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Lan
      DOTNET_ENVIRONMENT: Lan
      COOKIE_SECURE: "false"
      ALLOW_INSECURE_LAN_HTTP: "true"
      SERVER_ORIGIN: "${SERVER_ORIGIN:?Set SERVER_ORIGIN in .env.lan}"
      CORS_ALLOWED_ORIGINS: "${SERVER_ORIGIN:?Set SERVER_ORIGIN in .env.lan}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.lan}"
      AUTO_SUMMARY_ENABLED: "${AUTO_SUMMARY_ENABLED:-false}"
      ASSISTANT_ENABLED: "${ASSISTANT_ENABLED:-true}"
      AUTO_SUMMARY_PROFILE: "MEETING_PROTOCOL_RU"
      MEETING_TIMEZONE: "${MEETING_TIMEZONE:-Asia/Yekaterinburg}"
      # LAN deployments intentionally expose one shared read index.  Keep the
      # scope explicit so an omitted variable cannot silently drift between
      # organization and deployment semantics.
      MEETING_READ_SCOPE: "${MEETING_READ_SCOPE:-DEPLOYMENT}"
    ports: !reset []

  gpu-worker:
    environment:
      AUTO_SUMMARY_ENABLED: "${AUTO_SUMMARY_ENABLED:-false}"
      AUTO_SUMMARY_PROFILE: "MEETING_PROTOCOL_RU"

  summary-worker:
    environment:
      AUTO_SUMMARY_ENABLED: "${AUTO_SUMMARY_ENABLED:-false}"
      ASSISTANT_ENABLED: "${ASSISTANT_ENABLED:-true}"
      AUTO_SUMMARY_PROFILE: "MEETING_PROTOCOL_RU"
      MEETING_TIMEZONE: "${MEETING_TIMEZONE:-Asia/Yekaterinburg}"
      MEETING_READ_SCOPE: "${MEETING_READ_SCOPE:-DEPLOYMENT}"

  memory-worker:
    environment:
      MEMORY_WORKER_ENABLED: "${MEETING_MEMORY_ENABLED:-true}"
      MEETING_READ_SCOPE: "${MEETING_READ_SCOPE:-DEPLOYMENT}"

  lan-gateway:
    profiles: ["lan"]
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "${LAN_BIND_ADDRESS:?Set LAN_BIND_ADDRESS in .env.lan}:8080:8080"
    volumes:
      - ./infrastructure/caddy/Caddyfile.lan:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      tusd:
        condition: service_started
